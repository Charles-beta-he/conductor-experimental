name: Experimental source checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.11.15"
          - os: macos-15
            python: "3.13.17"
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install hash-locked verification tools
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Verify source publication boundaries
        run: |
          python -m pytest -q scripts/tests
          python scripts/verify.py
      - name: Build, test and exercise installed recovery
        run: python scripts/check.py --work-dir "$RUNNER_TEMP/conductor-check"
      - name: Check distribution provenance and boundaries
        run: python scripts/verify.py --dist "$RUNNER_TEMP/conductor-check/dist"
