[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "acp-conductor-replanning-experiment"
version = "0.0.1"
description = "Bounded local plan-admission metadata, separate from attempt lifecycle"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "PROVENANCE.md"]
dependencies = ["acp-conductor-experiment==0.0.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/acp_conductor_replanning"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "pyproject.toml", "LICENSE", "PROVENANCE.md", "README.md", "SPEC.md", "demo.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF022"]
