[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "acp-conductor-resolution-experiment"
version = "0.0.3"
description = "Version-isolated trusted local UNKNOWN-resolution successor"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "PROVENANCE.md"]
dependencies = ["acp-conductor-runtime-experiment==0.0.1", "acp-conductor-replanning-experiment==0.0.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/acp_conductor_resolution"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "pyproject.toml", "LICENSE", "PROVENANCE.md", "README.md", "SPEC.md", "demo.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
