[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "acp-conductor-runtime-experiment"
version = "0.0.1"
description = "Local durable adapter-attempt experiment; not ACP platform lifecycle"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "PROVENANCE.md"]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/acp_conductor_runtime"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "pyproject.toml", "LICENSE", "PROVENANCE.md", "README.md", "demo.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
